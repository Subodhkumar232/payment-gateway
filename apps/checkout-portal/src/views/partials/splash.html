                <stop offset="0%" stop-color="#0b63e5" />
                <stop offset="100%" stop-color="#0747a6" />
              </linearGradient>
            </defs>
            <path d="M50 4 L92 22 C92 72, 50 116, 50 116 C50 116, 8 72, 8 22 Z" fill="url(#ypgShieldGrad)" />

            <path d="M30 84 L30 36 L44 36 L50 56 L56 36 L70 36 L70 84 L60 84 L60 52 L54 70 L46 70 L40 52 L40 84 Z" fill="#ffffff" />

        <strong id="splashSecuredByText" style="color:var(--ypg-blue); font-size:15px; letter-spacing:-0.2px;">{{POWERED_BY}}</strong>
